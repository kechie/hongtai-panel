[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hongtai-panel"
version = "1.0.0"
description = "Linux driver for HONGTAI/LOVINGCOOL USB serial LCD panels (33c3:7791)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "Pillow>=9.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Desktop mirroring additionally needs PyGObject plus the GStreamer PipeWire
# plugin, which are distro packages rather than wheels on most systems.
mirror = ["PyGObject>=3.42"]

[project.scripts]
hongtai-panel = "hongtai_panel.cli:main"

[tool.setuptools]
packages = ["hongtai_panel"]
